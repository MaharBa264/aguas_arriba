<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aguas Arriba · ASCII River Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#081417;color:#c7ddd6;font:15px system-ui}header,section{padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}a{color:#a5d9c9}h1{font-size:20px;margin:0}canvas{display:block;width:100%;height: min(68vh,650px);touch-action:none;background:#071215}button,input{accent-color:#7bc5ae}button{background:#193b3b;color:#d5e8df;border:1px solid #42625c;padding:8px;border-radius:6px}small{color:#8daaa5}</style><header><a href="./">← Lance</a><h1>ASCII River Lab</h1><small>Experimento 04.1 · Río explorable</small></header><canvas id="c" aria-label="Río subacuático animado"></canvas><section><label>Cauce <select id="kind"><option value="serrano">Arroyo serrano</option><option value="rapidos">Rápidos</option><option value="pozon">Pozón</option><option value="curva">Curva</option><option value="estrecho">Estrechamiento</option></select></label><label>Zoom <input id="zoom" type="range" min=".12" max="2.2" step=".01" value=".85"></label><label>Corriente <input id="flow" type="range" min="0" max="2" step=".05" value=".7"></label><label>Cámara <input id="cam" type="range" min="-.7" max=".7" step=".01" value="0"></label><label><input type="checkbox" id="vectors"> Ver flujo</label><label><input type="checkbox" id="drift" checked> Deriva libre</label><button id="reset">Nuevas piedras</button><button id="home">Centrar vista</button><button id="pause">Pausa</button><small>Arrastrá para explorar · Pellizcá para zoom · Tocá para colocar la mosca.</small></section><script src="river-geometry.js"></script><script src="river-hydraulics.js"></script><script>
'use strict';
const c=document.querySelector('#c'),ctx=c.getContext('2d'),flow=document.querySelector('#flow'),cam=document.querySelector('#cam');
let W,H,C,R,dx,dy,depth,glyph,col,rocks=[],fish=[],particles=[],lure={x:1,y:0,z:0},target={...lure},paused=false,t=0,last=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let b=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=b.width;H=b.height;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);C=Math.max(40,Math.floor(W/4.5));R=Math.max(22,Math.floor(H/7.5));dx=W/C;dy=H/R;depth=new Float32Array(C*R);glyph=new Array(C*R);col=new Array(C*R)}
let geometry,seedNumber=42,viewX=0,viewY=0;const zoom=document.querySelector('#zoom');let scale=1,angle=0;function camera(){scale=Math.min(W/7.5,H/4.5)*+zoom.value;angle=+cam.value}const kind=document.querySelector('#kind');function wet(o){let mid=geometry.center(o.x),w=geometry.width(o.x);o.z=clamp(o.z,mid-w+.08,mid+w-.08);o.y=clamp(o.y,geometry.bed(o.x,o.z)+.08,2.35)}function seed(){geometry=RiverGeometry.create(kind.value,seedNumber);let state=seedNumber;const rng=()=>((state=Math.imul(1664525,state)+1013904223|0)>>>0)/4294967296;rocks=Array.from({length:48},()=>{let x=rng()*58-29,z=geometry.center(x)+(rng()*2-1)*geometry.width(x)*.8,r=.35+rng()*.65;return {x,z,r,y:geometry.bed(x,z)+r*.28}});fish=Array.from({length:15},(_,i)=>({x:(Math.floor(i/3)-2)*12+(i%3-1)*1.8,home:(Math.floor(i/3)-2)*12,y:1-(i%3)*.85,z:i%3===1?-1.1:1.2,phase:rand(0,6),vx:0}));particles=Array.from({length:350},()=>({x:rand(-30,30),y:rand(-1.7,2),z:rand(-3,3)}));for(const o of [...fish,...particles,lure])wet(o);target={...lure}}
function project(x,y,z){let a=angle,xx=(x-viewX)*Math.cos(a)+z*Math.sin(a),zz=z*Math.cos(a)-(x-viewX)*Math.sin(a),s=1/(1+clamp(zz,-5,5)*.065);return [Math.floor((W/2+xx*scale*s)/dx),Math.floor((H*.48-(y-viewY)*scale*s)/dy),zz]}
function dot(x,y,z,ch,color){let [i,j,k]=project(x,y,z);if(i<0||i>=C||j<0||j>=R)return;let n=j*C+i;if(k<depth[n]){depth[n]=k;glyph[n]=ch;col[n]=color}}
function avoid(o){for(const r of rocks){let x=o.x-r.x,y=o.y-r.y,z=o.z-r.z,d=Math.hypot(x,y,z),m=r.r+.16;if(d<m&&d>.0001){o.x=r.x+x*m/d;o.y=r.y+y*m/d;o.z=r.z+z*m/d}}}
function update(dt){let f=+flow.value;t+=dt;for(const p of particles){let q=RiverHydraulics.velocityAt(p.x,p.y,p.z,t,rocks,f,geometry);p.x+=dt*q.x;p.y=clamp(p.y+dt*q.y,-1.95,2.35);p.z=clamp(p.z+dt*q.z,-2.95,2.95);avoid(p);wet(p);if(p.x>30||p.x<-30){p.x=-29.9;p.y=rand(-1.7,2);p.z=rand(-2.8,2.8)}}for(const o of fish){let near=Math.hypot(o.x-lure.x,o.y-lure.y,o.z-lure.z)<2;let tx=near?lure.x+.35:o.home+Math.sin(t*.25+o.phase)*1.8,ty=near?lure.y:Math.sin(t*.6+o.phase)*.35+(1-fish.indexOf(o)%3)*.85;let desired=clamp((tx-o.x)*.7,-1.1,1.1);o.vx+=(desired-o.vx)*dt*2;o.x=clamp(o.x+o.vx*dt,o.home-3.5,o.home+3.5);o.y=clamp(o.y+(ty-o.y)*dt*.65,-1.2,1.5);avoid(o);wet(o)}if(document.querySelector('#drift').checked){let q=RiverHydraulics.velocityAt(lure.x,lure.y,lure.z,t,rocks,f,geometry);lure.x+=q.x*dt;lure.y=clamp(lure.y+q.y*dt,-1.8,2.3);lure.z=clamp(lure.z+q.z*dt,-2.9,2.9);if(lure.x>30)lure.x=-30;target={...lure}}else for(const k of ['x','y','z'])lure[k]+=(target[k]-lure[k])*Math.min(1,dt*3);avoid(lure);wet(lure)}
function draw(){camera();let span=W/scale*.85+5,lo=Math.max(-30,viewX-span),hi=Math.min(30,viewX+span),step=Math.max(.10,dx/scale*.65);depth.fill(Infinity);glyph.fill('');for(const p of particles)dot(p.x,p.y,p.z,p.x%2>0?'·':'.','#203b40');for(let x=lo;x<hi;x+=step){let mid=geometry.center(x),w=geometry.width(x);for(let z=mid-w;z<mid+w;z+=.13){let y=geometry.bed(x,z);dot(x,y,z,Math.sin(x*21+z*17)>.2?'o':'.',Math.abs(z-mid)>w*.8?'#657568':'#465b50')}for(let z=mid-w;z<mid+w;z+=.18)dot(x,2.4+.025*Math.sin(x*6+t*2+z),z,'~','#396e77');for(let y=geometry.bed(x,mid+w);y<2.4;y+=.12)dot(x,y,mid+w,':','#344c43');}
for(const r of rocks)if(r.x>=lo-2&&r.x<=hi+2)for(let a=0;a<Math.PI*2;a+=.12)for(let b=0;b<Math.PI;b+=.13){let v=Math.sin(b),light=(Math.cos(a)*v+1)/2;dot(r.x+r.r*v*Math.cos(a),r.y+r.r*.8*Math.cos(b),r.z+r.r*v*Math.sin(a),' .:oO#'[Math.floor(light*5)],light>.5?'#8a9990':'#4b635d')}
for(const o of fish){
if(o.x<lo-3||o.x>hi+3)continue;let dir=-1, size=fish.indexOf(o)%3===1?1.35:.92;if(scale*size<8){dot(o.x,o.y,o.z,'<','#b9d39b');continue;}
function part(x,y,z,ch,color){let wave=Math.sin(t*6-x*3+o.phase)*Math.pow(clamp((x+.15)/1.7,0,1),2)*.32;dot(o.x-dir*x*size,o.y+y*size,o.z+(z+wave)*size,ch,color)}
for(let i=0;i<=100;i++){let u=i/100,x=-1.05+u*2.1,rad=.48*Math.pow(Math.sin(Math.PI*u),.65)*(1-.65*u);for(let a=0;a<6.283;a+=.075){let y=rad*Math.cos(a),z=rad*.85*Math.sin(a),light=clamp(.65+.35*Math.cos(a),0,1);let spot=u>.15&&u<.85&&Math.sin(i*.91+Math.floor(a*8)*4.7)>.88;let color=spot?'#526349':y>.12?'#b9d39b':y<-.13?'#f0e1bd':'#e7a998';part(x,y,z,spot?'@':'oO08#'[Math.min(4,Math.floor(light*5))],color)}}
for(let u=0;u<=1;u+=.025)for(let v=-1;v<=1;v+=.055){if(Math.abs(v)<.23*u)continue;part(1.01+u*(.48+.14*Math.abs(v)),v*(.08+u*.38),0,'/','#d5c38c')}
for(let u=0;u<1;u+=.035)for(let v=0;v<1;v+=.06){part(-.25+u*.68,.24+v*.35*Math.sin(Math.PI*u),0,'^','#a6c28b');part(-.35+u*.5,-.17-v*.28*Math.sin(Math.PI*u),-.16,'/','#d7a37c')}
for(let a=0;a<6.28;a+=.12){part(-.78+.085*Math.cos(a),.09+.085*Math.sin(a),-.25,'O','#ffe5a0')}part(-.78,.09,-.29,'@','#101b17');part(-.98,-.07,-.16,'=','#f3dfbf');
}
if(!document.querySelector('#drift').checked)for(let u=0;u<1;u+=.015)dot(lure.x-u*u*.7*(+flow.value),lure.y+(2.4-lure.y)*u,lure.z,'·','#a3b9b5');dot(lure.x,lure.y,lure.z,'*','#ffb76c');ctx.fillStyle='#071215';ctx.fillRect(0,0,W,H);ctx.font=dy*.94+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';for(let n=0;n<glyph.length;n++)if(glyph[n]){ctx.fillStyle=col[n];ctx.fillText(glyph[n],(n%C+.5)*dx,(Math.floor(n/C)+.5)*dy)}if(document.querySelector('#vectors').checked){ctx.strokeStyle='#64c4d099';ctx.lineWidth=1;for(let x=lo;x<=hi;x+=Math.max(.55,span/12))for(let y=-1.7;y<=2.2;y+=.45){let q=RiverHydraulics.velocityAt(x,y,0,t,rocks,+flow.value,geometry),a=project(x,y,0),b=project(x+q.x*.45,y+q.y*.45,q.z*.45);let ax=(a[0]+.5)*dx,ay=(a[1]+.5)*dy,bx=(b[0]+.5)*dx,by=(b[1]+.5)*dy,ang=Math.atan2(by-ay,bx-ax);if(Math.hypot(bx-ax,by-ay)<2)continue;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(bx-4*Math.cos(ang-.5),by-4*Math.sin(ang-.5));ctx.moveTo(bx,by);ctx.lineTo(bx-4*Math.cos(ang+.5),by-4*Math.sin(ang+.5));ctx.stroke()}}}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused)update(dt);draw();requestAnimationFrame(frame)}
function point(e){camera();document.querySelector('#drift').checked=false;let b=c.getBoundingClientRect();target.x=clamp(viewX+(e.clientX-b.left-W/2)/scale/Math.cos(angle),-30,30);target.y=clamp(viewY+(H*.48-e.clientY+b.top)/scale,-2,2.35);target.z=geometry.center(target.x);wet(target)}
const pointers=new Map();let moved=false;
function distance(){let [a,b]=[...pointers.values()];return Math.hypot(a.x-b.x,a.y-b.y)}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);if(!pointers.size)moved=false;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});if(pointers.size>1)moved=true};
c.onpointermove=e=>{let p=pointers.get(e.pointerId);if(!p)return;camera();let old=pointers.size===2?distance():0,ddx=e.clientX-p.x,ddy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(pointers.size===2){let d=distance();if(old>0)zoom.value=clamp(+zoom.value*d/old,.12,2.2);moved=true}else if(pointers.size===1){if(Math.hypot(p.x-p.sx,p.y-p.sy)>6)moved=true;if(moved){viewX=clamp(viewX-ddx/scale/Math.cos(angle),-30,30);viewY=clamp(viewY+ddy/scale,-3,3)}}};
c.onpointerup=e=>{if(pointers.size===1&&!moved)point(e);pointers.delete(e.pointerId)};c.onpointercancel=e=>{pointers.delete(e.pointerId);moved=true};c.onwheel=e=>{e.preventDefault();zoom.value=clamp(+zoom.value*Math.exp(-e.deltaY*.001),.12,2.2)};document.querySelector('#home').onclick=()=>{viewX=0;viewY=0;zoom.value=.85;cam.value=0};
document.querySelector('#reset').onclick=()=>{seedNumber++;seed()};kind.onchange=seed;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausa'};window.addEventListener('resize',resize);resize();seed();requestAnimationFrame(frame);
</script></html>
