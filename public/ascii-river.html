<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aguas Arriba · ASCII River Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#081417;color:#c7ddd6;font:15px system-ui}header,section{padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}a{color:#a5d9c9}h1{font-size:20px;margin:0}canvas{display:block;width:100%;height: min(68vh,650px);touch-action:none;background:#071215}button,input{accent-color:#7bc5ae}button{background:#193b3b;color:#d5e8df;border:1px solid #42625c;padding:8px;border-radius:6px}small{color:#8daaa5}</style><header><a href="./">← Lance</a><h1>ASCII River Lab</h1><small>Experimento 01 · Truchas y corriente</small></header><canvas id="c" aria-label="Río subacuático animado"></canvas><section><label>Corriente <input id="flow" type="range" min="0" max="2" step=".05" value=".7"></label><label>Cámara <input id="cam" type="range" min="-.7" max=".7" step=".01" value="0"></label><button id="reset">Nuevas piedras</button><button id="pause">Pausa</button><small>Tocá el agua para mover la mosca.</small></section><script>
'use strict';
const c=document.querySelector('#c'),ctx=c.getContext('2d'),flow=document.querySelector('#flow'),cam=document.querySelector('#cam');
let W,H,C,R,dx,dy,depth,glyph,col,rocks=[],fish=[],particles=[],lure={x:1,y:0,z:0},target={...lure},paused=false,t=0,last=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let b=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=b.width;H=b.height;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);C=Math.max(40,Math.floor(W/7));R=Math.max(22,Math.floor(H/11));dx=W/C;dy=H/R;depth=new Float32Array(C*R);glyph=new Array(C*R);col=new Array(C*R)}
function seed(){rocks=Array.from({length:7},()=>({x:rand(-5.5,5.5),y:-1.65,z:rand(-2,2),r:rand(.35,.85)}));fish=Array.from({length:3},(_,i)=>({x:-3+i*3,y:rand(-.7,.8),z:rand(-1,1),phase:rand(0,6),vx:0}));particles=Array.from({length:280},()=>({x:rand(-7,7),y:rand(-1.7,2),z:rand(-3,3)}))}
function project(x,y,z){let a=+cam.value,xx=x*Math.cos(a)+z*Math.sin(a),zz=z*Math.cos(a)-x*Math.sin(a),s=1/(1+zz*.065),scale=Math.min(W/13,H/5);return [Math.floor((W/2+xx*scale*s)/dx),Math.floor((H*.48-y*scale*s)/dy),zz]}
function dot(x,y,z,ch,color){let [i,j,k]=project(x,y,z);if(i<0||i>=C||j<0||j>=R)return;let n=j*C+i;if(k<depth[n]){depth[n]=k;glyph[n]=ch;col[n]=color}}
function avoid(o){for(const r of rocks){let x=o.x-r.x,y=o.y-r.y,z=o.z-r.z,d=Math.hypot(x,y,z),m=r.r+.16;if(d<m&&d>.0001){o.x=r.x+x*m/d;o.y=r.y+y*m/d;o.z=r.z+z*m/d}}}
function update(dt){let f=+flow.value;t+=dt;for(const p of particles){p.x+=dt*f*.8;if(p.x>7)p.x=-7}for(const o of fish){let near=Math.hypot(o.x-lure.x,o.y-lure.y,o.z-lure.z)<2;let tx=near?lure.x+.35:Math.sin(t*.25+o.phase)*3.5,ty=near?lure.y:Math.sin(t*.6+o.phase)*.65;let desired=clamp((tx-o.x)*.7,-1.1,1.1);o.vx+=(desired-o.vx)*dt*2;o.x=clamp(o.x+o.vx*dt,-5.5,5.5);o.y=clamp(o.y+(ty-o.y)*dt*.65,-1.2,1.5);avoid(o)}for(const k of ['x','y','z'])lure[k]+=(target[k]-lure[k])*Math.min(1,dt*3);avoid(lure)}
function draw(){depth.fill(Infinity);glyph.fill('');for(const p of particles)dot(p.x,p.y,p.z,p.x%2>0?'·':'.','#31565a');for(let x=-7;x<7;x+=.16)for(let z=-3;z<3;z+=.24)dot(x,-2+.08*Math.sin(x*4+z),z,'.','#3d5049');
for(const r of rocks)for(let a=0;a<Math.PI*2;a+=.12)for(let b=0;b<Math.PI;b+=.13){let v=Math.sin(b),light=(Math.cos(a)*v+1)/2;dot(r.x+r.r*v*Math.cos(a),r.y+r.r*.8*Math.cos(b),r.z+r.r*v*Math.sin(a),' .:oO#'[Math.floor(light*5)],light>.5?'#8a9990':'#4b635d')}
for(const o of fish){let dir=o.vx>.15?1:-1;for(let i=0;i<=64;i++){let u=i/64,x=(u-.5)*1.65,rad=.31*Math.pow(Math.sin(Math.PI*u),.75)*(1-.48*u),wave=Math.sin(t*7-u*5+o.phase)*u*u*.23;for(let a=0;a<6.28;a+=.16){let y=rad*Math.cos(a),z=rad*.63*Math.sin(a)+wave,lit=(Math.cos(a)+1)/2;let spot=Math.sin(i*12.9+a*17)> .84;let color=spot?'#292e28':Math.abs(y)<.055?'#d89c91':lit>.65?'#8ca47c':lit<.3?'#d9cda3':'#a5b68a';dot(o.x-dir*x,o.y+y,o.z+z,spot?'@':' .:oO8'[Math.floor(lit*5)],color)}}for(let u=0;u<1;u+=.045)for(let v=-1;v<=1;v+=.13)dot(o.x-dir*(.78+u*.43),o.y+v*u*.33,o.z+Math.sin(t*7-5-u*2+o.phase)*.27,'/', '#a4ad82');dot(o.x+dir*.57,o.y+.09,o.z-.13,'@','#e9e3c4')}
for(let u=0;u<1;u+=.015)dot(lure.x,lure.y+(2.4-lure.y)*u,lure.z,'·','#a3b9b5');dot(lure.x,lure.y,lure.z,'*','#ffb76c');ctx.fillStyle='#071215';ctx.fillRect(0,0,W,H);ctx.font=dy*.94+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';for(let n=0;n<glyph.length;n++)if(glyph[n]){ctx.fillStyle=col[n];ctx.fillText(glyph[n],(n%C+.5)*dx,(Math.floor(n/C)+.5)*dy)}}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused)update(dt);draw();requestAnimationFrame(frame)}
function point(e){let b=c.getBoundingClientRect(),s=Math.min(W/13,H/5);target.x=clamp((e.clientX-b.left-W/2)/s/Math.cos(+cam.value),-5.5,5.5);target.y=clamp((H*.48-e.clientY+b.top)/s,-1.4,1.8)}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);point(e)};c.onpointermove=e=>{if(e.buttons)point(e)};document.querySelector('#reset').onclick=seed;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausa'};window.addEventListener('resize',resize);resize();seed();requestAnimationFrame(frame);
</script></html>
