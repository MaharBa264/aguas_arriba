<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aguas Arriba · ASCII River Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#081417;color:#c7ddd6;font:15px system-ui}header,section{padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}a{color:#a5d9c9}h1{font-size:20px;margin:0}canvas{display:block;width:100%;height: min(68vh,650px);touch-action:none;background:#071215}button,input{accent-color:#7bc5ae}button{background:#193b3b;color:#d5e8df;border:1px solid #42625c;padding:8px;border-radius:6px}small{color:#8daaa5}</style><header><a href="./">← Lance</a><h1>ASCII River Lab</h1><small>Experimento 02 · Anatomía y contraste</small></header><canvas id="c" aria-label="Río subacuático animado"></canvas><section><label>Corriente <input id="flow" type="range" min="0" max="2" step=".05" value=".7"></label><label>Cámara <input id="cam" type="range" min="-.7" max=".7" step=".01" value="0"></label><button id="reset">Nuevas piedras</button><button id="pause">Pausa</button><small>Tocá el agua para mover la mosca.</small></section><script>
'use strict';
const c=document.querySelector('#c'),ctx=c.getContext('2d'),flow=document.querySelector('#flow'),cam=document.querySelector('#cam');
let W,H,C,R,dx,dy,depth,glyph,col,rocks=[],fish=[],particles=[],lure={x:1,y:0,z:0},target={...lure},paused=false,t=0,last=0;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){let b=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=b.width;H=b.height;c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);C=Math.max(40,Math.floor(W/4.5));R=Math.max(22,Math.floor(H/7.5));dx=W/C;dy=H/R;depth=new Float32Array(C*R);glyph=new Array(C*R);col=new Array(C*R)}
function seed(){rocks=Array.from({length:7},()=>({x:rand(-5.5,5.5),y:-1.65,z:rand(-2,2),r:rand(.35,.85)}));fish=Array.from({length:3},(_,i)=>({x:-1.8+i*1.8,y:1-i*.85,z:i===1?-1.1:1.2,phase:rand(0,6),vx:0}));particles=Array.from({length:85},()=>({x:rand(-7,7),y:rand(-1.7,2),z:rand(-3,3)}))}
function project(x,y,z){let a=+cam.value,xx=x*Math.cos(a)+z*Math.sin(a),zz=z*Math.cos(a)-x*Math.sin(a),s=1/(1+zz*.065),scale=Math.min(W/7.5,H/4.5);return [Math.floor((W/2+xx*scale*s)/dx),Math.floor((H*.48-y*scale*s)/dy),zz]}
function dot(x,y,z,ch,color){let [i,j,k]=project(x,y,z);if(i<0||i>=C||j<0||j>=R)return;let n=j*C+i;if(k<depth[n]){depth[n]=k;glyph[n]=ch;col[n]=color}}
function avoid(o){for(const r of rocks){let x=o.x-r.x,y=o.y-r.y,z=o.z-r.z,d=Math.hypot(x,y,z),m=r.r+.16;if(d<m&&d>.0001){o.x=r.x+x*m/d;o.y=r.y+y*m/d;o.z=r.z+z*m/d}}}
function update(dt){let f=+flow.value;t+=dt;for(const p of particles){p.x+=dt*f*.8;if(p.x>7)p.x=-7}for(const o of fish){let near=Math.hypot(o.x-lure.x,o.y-lure.y,o.z-lure.z)<2;let tx=near?lure.x+.35:Math.sin(t*.25+o.phase)*1.8,ty=near?lure.y:Math.sin(t*.6+o.phase)*.35+(1-fish.indexOf(o))*.85;let desired=clamp((tx-o.x)*.7,-1.1,1.1);o.vx+=(desired-o.vx)*dt*2;o.x=clamp(o.x+o.vx*dt,-2.2,2.2);o.y=clamp(o.y+(ty-o.y)*dt*.65,-1.2,1.5);avoid(o)}for(const k of ['x','y','z'])lure[k]+=(target[k]-lure[k])*Math.min(1,dt*3);avoid(lure)}
function draw(){depth.fill(Infinity);glyph.fill('');for(const p of particles)dot(p.x,p.y,p.z,p.x%2>0?'·':'.','#203b40');for(let x=-7;x<7;x+=.16)for(let z=-3;z<3;z+=.24)dot(x,-2+.08*Math.sin(x*4+z),z,'.','#263d37');
for(const r of rocks)for(let a=0;a<Math.PI*2;a+=.12)for(let b=0;b<Math.PI;b+=.13){let v=Math.sin(b),light=(Math.cos(a)*v+1)/2;dot(r.x+r.r*v*Math.cos(a),r.y+r.r*.8*Math.cos(b),r.z+r.r*v*Math.sin(a),' .:oO#'[Math.floor(light*5)],light>.5?'#8a9990':'#4b635d')}
for(const o of fish){
let dir=-1, size=fish.indexOf(o)===1?1.35:.92;
function part(x,y,z,ch,color){let wave=Math.sin(t*6-x*3+o.phase)*Math.pow(clamp((x+.15)/1.7,0,1),2)*.32;dot(o.x-dir*x*size,o.y+y*size,o.z+(z+wave)*size,ch,color)}
for(let i=0;i<=100;i++){let u=i/100,x=-1.05+u*2.1,rad=.48*Math.pow(Math.sin(Math.PI*u),.65)*(1-.65*u);for(let a=0;a<6.283;a+=.075){let y=rad*Math.cos(a),z=rad*.85*Math.sin(a),light=clamp(.65+.35*Math.cos(a),0,1);let spot=u>.15&&u<.85&&Math.sin(i*.91+Math.floor(a*8)*4.7)>.88;let color=spot?'#526349':y>.12?'#b9d39b':y<-.13?'#f0e1bd':'#e7a998';part(x,y,z,spot?'@':'oO08#'[Math.min(4,Math.floor(light*5))],color)}}
for(let u=0;u<=1;u+=.025)for(let v=-1;v<=1;v+=.055){if(Math.abs(v)<.23*u)continue;part(1.01+u*(.48+.14*Math.abs(v)),v*(.08+u*.38),0,'/','#d5c38c')}
for(let u=0;u<1;u+=.035)for(let v=0;v<1;v+=.06){part(-.25+u*.68,.24+v*.35*Math.sin(Math.PI*u),0,'^','#a6c28b');part(-.35+u*.5,-.17-v*.28*Math.sin(Math.PI*u),-.16,'/','#d7a37c')}
for(let a=0;a<6.28;a+=.12){part(-.78+.085*Math.cos(a),.09+.085*Math.sin(a),-.25,'O','#ffe5a0')}part(-.78,.09,-.29,'@','#101b17');part(-.98,-.07,-.16,'=','#f3dfbf');
}
for(let u=0;u<1;u+=.015)dot(lure.x,lure.y+(2.4-lure.y)*u,lure.z,'·','#a3b9b5');dot(lure.x,lure.y,lure.z,'*','#ffb76c');ctx.fillStyle='#071215';ctx.fillRect(0,0,W,H);ctx.font=dy*.94+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';for(let n=0;n<glyph.length;n++)if(glyph[n]){ctx.fillStyle=col[n];ctx.fillText(glyph[n],(n%C+.5)*dx,(Math.floor(n/C)+.5)*dy)}}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused)update(dt);draw();requestAnimationFrame(frame)}
function point(e){let b=c.getBoundingClientRect(),s=Math.min(W/7.5,H/4.5);target.x=clamp((e.clientX-b.left-W/2)/s/Math.cos(+cam.value),-5.5,5.5);target.y=clamp((H*.48-e.clientY+b.top)/s,-1.4,1.8)}
c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);point(e)};c.onpointermove=e=>{if(e.buttons)point(e)};document.querySelector('#reset').onclick=seed;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Continuar':'Pausa'};window.addEventListener('resize',resize);resize();seed();requestAnimationFrame(frame);
</script></html>
